<nav class="navbar">
    <!-- Link para volver al inicio -->
    <a routerLink="/" class="logo">🍿 Cine UTN</a>

    <div class="menu-usuario">
        <!-- Leemos el Signal de sesión. Si existe, guardamos los datos en 's' -->
        @if (auth.session(); as s) {
            <span class="saludo">Hola, {{ s.user.email }}</span>
            
            <!-- ACÁ ESTÁ LA MAGIA: Ocultamos solo el botón del admin -->
            @if (auth.rol() === 'admin') {
                <a routerLink="/admin" class="btn-admin">Panel Admin</a>
            }
            
            <!-- Botón para cerrar sesión -->
            <button class="btn-logout" (click)="cerrarSesion()">Salir</button>
        } @else {
            <!-- Si no hay sesión, mostramos el botón de OAuth -->
            <button class="btn-login" (click)="auth.login()">Entrar con GitHub</button>
        }
    </div>
</nav>
