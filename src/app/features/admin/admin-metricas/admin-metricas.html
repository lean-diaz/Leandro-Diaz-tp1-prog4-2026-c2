<div class="admin-container">
    <h2>Métricas de Ventas 📊</h2>
    <p class="subtitle">Análisis de rendimiento real por película.</p>

    <!-- BOTONES DE EXPORTACIÓN -->
    <div class="acciones-export">
        <button class="btn-success" (click)="exportarExcel()">📊 Descargar Excel</button>
        <button class="btn-secundario" (click)="exportarPDF()">📄 Guardar como PDF</button>
    </div>

    @if (isLoading) {
    <div class="loading">Calculando ventas totales...</div>
    } @else {
    <div class="chart-container">
        <!-- El #graficoVentas es vital para que TypeScript lo encuentre -->
        <canvas #graficoVentas></canvas>
    </div>
    }
</div>
