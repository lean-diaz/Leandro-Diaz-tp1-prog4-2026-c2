<div class="home-container">
    <h1 class="titulo-cartelera">Cartelera de Cine</h1>

    <!-- Grilla Responsive -->
    <div class="peliculas-grid">

        <!-- El bucle de Angular adaptado a tus variables -->
        @for (pelicula of cartelera; track pelicula.id) {
        
            <div class="pelicula-card" [routerLink]="['/compra', pelicula.id]">
                <img [src]="pelicula.imagen_url" [alt]="pelicula.nombre" class="poster">
                
                <div class="info-peli">
                    <h3>{{ pelicula.nombre }}</h3>
                </div>
            </div>
        
        }
    </div>
</div>
