<div class="login-container">
    <div class="login-box">
        <h2>Acceso al Sistema</h2>

    <div class="input-group">
        <label for="email">Correo Electrónico</label>
        <input
            type="email"
            id="email"
            [(ngModel)]="email"
            placeholder="profe@utn.edu.ar"
            [disabled]="isLoading()"
        />
    </div>

    <div class="input-group">
        <label for="password">Contraseña</label>
        <input
            type="password"
            id="password"
            [(ngModel)]="password"
            placeholder="••••••••"
            [disabled]="isLoading()"
        />
    </div>

    <!-- Si hay error, mostramos el cartelito rojo -->
    @if (errorMessage()) {
        <div class="error-msg">{{ errorMessage() }}</div>
    }

    <div class="botones">
        <button
            class="btn-primary"
            (click)="iniciarSesion()"
            [disabled]="isLoading()"
        >
            {{ isLoading() ? 'Cargando...' : 'Iniciar Sesión' }}
        </button>

    </div>
    </div>
</div>
